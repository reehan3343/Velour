<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — VELOUR</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{serif:['Playfair Display','serif'],sans:['Inter','sans-serif']},colors:{gold:'#c9a24b',ink:'#0e0e10'}}}}</script>
<style>.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15)}</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3d98b'/%3E%3Cstop offset='1' stop-color='%23c9a24b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230e0e10'/%3E%3Crect x='3' y='3' width='58' height='58' rx='13' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='bold' text-anchor='middle' fill='url(%23g)'%3EV%3C/text%3E%3C/svg%3E">
<style>main{padding-top:7.5rem!important}</style>
</head>
<body class="bg-ink text-zinc-200 font-sans antialiased">
<header id="nvHeader" class="fixed top-0 inset-x-0 z-[60]">
  <!-- mobile overlay -->
  <div id="nvMenu" class="fixed inset-0 bg-ink/95 backdrop-blur-2xl opacity-0 pointer-events-none transition-opacity duration-500 flex flex-col items-center justify-center">
    <div class="absolute -top-20 -left-20 w-72 h-72 rounded-full bg-gold/20 blur-3xl"></div>
    <div class="absolute -bottom-20 -right-20 w-72 h-72 rounded-full bg-amber-700/20 blur-3xl"></div>
    <ul class="relative text-center space-y-6"><li><a href="index.html" class="font-serif text-4xl text-white hover:text-gold transition">Home</a></li>
      <li><a href="shop.html" class="font-serif text-4xl text-white hover:text-gold transition">Shop</a></li>
      <li><a href="product.html" class="font-serif text-4xl text-white hover:text-gold transition">Product</a></li>
      <li><a href="cart.html" class="font-serif text-4xl text-white hover:text-gold transition">Cart</a></li>
      <li><a href="index.html#contact" class="font-serif text-4xl text-white hover:text-gold transition">Contact</a></li></ul>
    <a href="shop.html" class="relative mt-12 px-8 py-3 rounded-full bg-gold text-black font-semibold">Shop Now</a>
  </div>

  <div class="flex justify-center px-4 pt-4">
    <nav id="nvPill" class="relative w-full max-w-5xl flex items-center justify-between gap-2 rounded-full border border-white/15 bg-white/5 backdrop-blur-xl pl-3 pr-2 py-2 transition-all duration-500">
      <span class="pointer-events-none absolute inset-x-10 -bottom-px h-px bg-gradient-to-r from-transparent via-gold to-transparent"></span>

      <a href="index.html" class="flex items-center gap-3 group">
        <span class="w-9 h-9 rounded-full bg-gradient-to-br from-[#f3d98b] to-gold text-black font-serif font-black flex items-center justify-center group-hover:rotate-[360deg] transition duration-700">V</span>
        <span class="font-serif text-lg font-bold tracking-[.3em] text-white hidden sm:block">VELOUR</span>
      </a>

      <div id="nvLinks" class="relative hidden md:flex items-center">
        <span id="nvInd" class="absolute top-0 left-0 h-full w-0 rounded-full bg-gold/15 border border-gold/40 shadow-[0_0_20px_rgba(201,162,75,.25)] opacity-0 transition-all duration-300 ease-out"></span>
        <a href="index.html" data-active="0" class="relative z-10 px-4 py-2.5 text-[11px] uppercase tracking-[.2em] text-zinc-300 whitespace-nowrap transition-colors">Home</a>
        <a href="shop.html" data-active="0" class="relative z-10 px-4 py-2.5 text-[11px] uppercase tracking-[.2em] text-zinc-300 whitespace-nowrap transition-colors">Shop</a>
        <a href="product.html" data-active="0" class="relative z-10 px-4 py-2.5 text-[11px] uppercase tracking-[.2em] text-zinc-300 whitespace-nowrap transition-colors">Product</a>
        <a href="cart.html" data-active="1" class="relative z-10 px-4 py-2.5 text-[11px] uppercase tracking-[.2em] text-zinc-300 whitespace-nowrap transition-colors">Cart</a>
        <a href="index.html#contact" data-active="0" class="relative z-10 px-4 py-2.5 text-[11px] uppercase tracking-[.2em] text-zinc-300 whitespace-nowrap transition-colors">Contact</a>
      </div>

      <div class="flex items-center gap-1.5">
        <button aria-label="Search" class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-300 hover:text-gold hover:bg-white/10 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.5-3.5"/></svg>
        </button>
        <a href="cart.html" aria-label="Cart" class="relative w-10 h-10 rounded-full flex items-center justify-center text-zinc-300 hover:text-gold hover:bg-white/10 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 8h12l1 12H5L6 8zM9 8V6a3 3 0 016 0v2"/></svg>
          <span class="absolute top-0.5 right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-gold text-black text-[10px] font-bold flex items-center justify-center animate-pulse">3</span>
        </a>
        <a href="shop.html" class="hidden lg:inline-flex ml-1 px-5 py-2.5 rounded-full bg-gradient-to-r from-[#f3d98b] to-gold text-black text-sm font-semibold hover:shadow-[0_0_30px_rgba(201,162,75,.6)] hover:scale-105 transition">Shop Now</a>
        <button id="nvBurger" aria-label="Menu" class="md:hidden w-10 h-10 rounded-full flex flex-col items-center justify-center gap-[5px] hover:bg-white/10 transition">
          <span class="b1 block w-5 h-0.5 bg-white transition duration-300"></span>
          <span class="b2 block w-5 h-0.5 bg-white transition duration-300"></span>
          <span class="b3 block w-5 h-0.5 bg-white transition duration-300"></span>
        </button>
      </div>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-14">
  <h1 class="font-serif text-5xl text-white mb-10">Your Cart</h1>
  <div class="grid lg:grid-cols-3 gap-10">
    <div class="lg:col-span-2 space-y-5" id="items"></div>

    <aside class="glass rounded-3xl p-8 h-fit lg:sticky lg:top-24">
      <h2 class="font-serif text-2xl text-white mb-6">Order Summary</h2>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-zinc-400">Subtotal</span><span id="sub">$0</span></div>
        <div class="flex justify-between"><span class="text-zinc-400">Shipping</span><span id="ship">$0</span></div>
        <div class="flex justify-between border-t border-white/10 pt-4 text-lg text-white"><span>Total</span><span id="tot" class="text-gold font-serif text-2xl">$0</span></div>
      </div>
      <div class="flex mt-6"><input placeholder="Promo code" class="flex-1 min-w-0 bg-white/5 border border-white/10 rounded-l-full px-4 py-3 text-sm focus:outline-none focus:border-gold"><button class="bg-white/10 px-5 rounded-r-full text-sm hover:bg-white/20">Apply</button></div>
      <button onclick="alert('Demo only — checkout not connected.')" class="w-full mt-6 py-4 rounded-full bg-gold text-black font-semibold hover:shadow-[0_0_40px_rgba(201,162,75,.5)] transition">Checkout</button>
      <p class="text-xs text-zinc-500 text-center mt-4">🔒 Secure payment · Free returns</p>
    </aside>
  </div>
</main>
<footer class="border-t border-white/10 py-8 text-center text-xs text-zinc-600">© 2026 Velour Fashion House. All rights reserved.</footer>

<script>
const C=[
{n:"Urban Bomber",v:"Black · M",p:139,q:1,i:"photo-1552374196-1ab2a1c593e8"},
{n:"Noir Silk Dress",v:"Black · S",p:129,q:1,i:"photo-1496747611176-843222e1e57c"},
{n:"Essential White Tee",v:"White · L",p:39,q:2,i:"photo-1521572163474-6864f9cf17ab"}];
function draw(){
 document.getElementById('items').innerHTML=C.length?C.map((c,k)=>`
 <div class="glass rounded-3xl p-4 flex gap-5 items-center">
  <img src="https://images.unsplash.com/${c.i}?auto=format&fit=crop&w=300&q=80" alt="${c.n}" class="w-28 h-32 object-cover rounded-2xl">
  <div class="flex-1"><h3 class="font-serif text-xl text-white">${c.n}</h3><p class="text-sm text-zinc-500">${c.v}</p>
   <div class="flex items-center gap-3 mt-3"><button onclick="ch(${k},-1)" class="w-8 h-8 rounded-full bg-white/10">−</button><span>${c.q}</span><button onclick="ch(${k},1)" class="w-8 h-8 rounded-full bg-white/10">+</button></div></div>
  <div class="text-right"><p class="text-gold font-serif text-xl">$${c.p*c.q}</p><button onclick="C.splice(${k},1);draw()" class="text-xs text-zinc-500 hover:text-red-400 mt-3">Remove</button></div>
 </div>`).join(''):'<p class="text-zinc-500">Your cart is empty.</p>';
 const s=C.reduce((a,c)=>a+c.p*c.q,0),sh=s>80||!s?0:9;
 sub.textContent='$'+s;ship.textContent=sh?'$'+sh:'Free';tot.textContent='$'+(s+sh)}
function ch(k,d){C[k].q=Math.max(1,C[k].q+d);draw()}
draw();
</script>

<!-- Back to top with scroll progress ring -->
<button id="toTop" aria-label="Back to top" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-ink/80 backdrop-blur text-gold flex items-center justify-center opacity-0 translate-y-4 pointer-events-none transition-all duration-300 hover:scale-110 hover:shadow-[0_0_30px_rgba(201,162,75,.5)]">
  <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="26" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
    <circle id="toTopRing" cx="28" cy="28" r="26" fill="none" stroke="#c9a24b" stroke-width="3" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
  </svg>
  <svg class="relative w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
</button>
<script>
(()=>{const b=document.getElementById('toTop'),r=document.getElementById('toTopRing'),C=163.36;
function u(){const h=document.documentElement.scrollHeight-innerHeight,p=h>0?scrollY/h:0;
r.style.strokeDashoffset=C*(1-p);
const s=scrollY>300;b.classList.toggle('opacity-0',!s);b.classList.toggle('translate-y-4',!s);b.classList.toggle('pointer-events-none',!s)}
addEventListener('scroll',u,{passive:true});addEventListener('resize',u);u();
b.onclick=()=>scrollTo({top:0,behavior:'smooth'})})();
</script>

<script>
(()=>{
const pill=document.getElementById('nvPill'),wrap=document.getElementById('nvLinks'),ind=document.getElementById('nvInd'),
links=[...wrap.querySelectorAll('a')],menu=document.getElementById('nvMenu'),burger=document.getElementById('nvBurger'),
mlinks=[...menu.querySelectorAll('li')];
let active=links.find(a=>a.dataset.active==='1')||null;
function paint(){links.forEach(a=>{const on=a===active;a.classList.toggle('text-gold',on);a.classList.toggle('text-zinc-300',!on)})}
function mv(a){if(!a){ind.style.opacity=0;return}ind.style.opacity=1;ind.style.width=a.offsetWidth+'px';ind.style.transform='translateX('+a.offsetLeft+'px)'}
links.forEach(a=>a.addEventListener('mouseenter',()=>mv(a)));
wrap.addEventListener('mouseleave',()=>mv(active));
function set(a){if(a===active)return;active=a;paint();mv(a)}
paint();addEventListener('load',()=>mv(active));addEventListener('resize',()=>mv(active));setTimeout(()=>mv(active),150);

const spy=links.filter(a=>a.getAttribute('href').startsWith('#')&&a.getAttribute('href').length>1);
function onScroll(){
  const s=scrollY>20;
  pill.classList.toggle('bg-black/70',s);pill.classList.toggle('bg-white/5',!s);
  pill.classList.toggle('shadow-[0_15px_50px_rgba(0,0,0,.6)]',s);pill.classList.toggle('py-1.5',s);pill.classList.toggle('py-2',!s);
  if(spy.length){let cur=null;spy.forEach(a=>{const el=document.querySelector(a.getAttribute('href'));if(el&&el.getBoundingClientRect().top<=innerHeight*.4)cur=a});set(cur)}
}
addEventListener('scroll',onScroll,{passive:true});onScroll();

function toggle(open){
  menu.classList.toggle('opacity-0',!open);menu.classList.toggle('pointer-events-none',!open);
  document.body.style.overflow=open?'hidden':'';
  burger.querySelector('.b1').style.transform=open?'translateY(7px) rotate(45deg)':'';
  burger.querySelector('.b2').style.opacity=open?0:1;
  burger.querySelector('.b3').style.transform=open?'translateY(-7px) rotate(-45deg)':'';
  mlinks.forEach((li,i)=>{li.style.transition='all .5s '+(open?(i*70+150):0)+'ms';li.style.opacity=open?1:0;li.style.transform=open?'none':'translateY(20px)'});
}
mlinks.forEach(li=>{li.style.opacity=0;li.style.transform='translateY(20px)'});
let isOpen=false;burger.onclick=()=>{isOpen=!isOpen;toggle(isOpen)};
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{isOpen=false;toggle(false)}));
})();
</script>
</body>
</html>
